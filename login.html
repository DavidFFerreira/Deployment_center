<!DOCTYPE html>
<html lang="pt-PT" class="dark">
<head>
  <meta charset="UTF-8">
  <title>Universal Deployment Center — Autenticação</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-950 text-slate-100 flex items-center justify-center min-h-screen p-4 font-sans selection:bg-indigo-500 selection:text-white">
  <div class="max-w-md w-full p-8 rounded-3xl bg-slate-900 border border-slate-800 shadow-2xl space-y-6">
    <div class="text-center space-y-2">
      <div class="inline-flex p-3 rounded-2xl bg-indigo-500/10 text-indigo-400 mb-2 border border-indigo-500/20 shadow-lg shadow-indigo-500/10">
        <i data-lucide="rocket" class="w-8 h-8"></i>
      </div>
      <h1 class="text-2xl font-bold tracking-tight text-white flex items-center justify-center gap-2">
        Deployment Center
      </h1>
      <p class="text-xs text-slate-400">Painel Universal de Infraestrutura, Deploys e Stacks</p>
    </div>

    <!-- Mensagem de erro caso exista no URL -->
    <div id="error-alert" class="hidden p-3 rounded-xl bg-rose-500/10 border border-rose-500/30 text-rose-400 text-xs font-semibold text-center">
      Credenciais incorretas. Por favor verifique o utilizador e a palavra-passe.
    </div>

    <form method="POST" action="/login" class="space-y-4">
      <div>
        <label class="block text-xs font-semibold text-slate-300 mb-1.5">Nome de Utilizador</label>
        <div class="relative">
          <input type="text" name="username" required placeholder="admin" autofocus class="w-full px-4 py-3 rounded-xl bg-slate-950 border border-slate-800 focus:border-indigo-500 focus:outline-none text-sm text-white transition placeholder-slate-600">
        </div>
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-300 mb-1.5">Palavra-passe</label>
        <div class="relative">
          <input type="password" name="password" required placeholder="••••••••••••" class="w-full px-4 py-3 rounded-xl bg-slate-950 border border-slate-800 focus:border-indigo-500 focus:outline-none text-sm text-white transition placeholder-slate-600">
        </div>
      </div>

      <button type="submit" class="w-full py-3 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-sm transition shadow-lg shadow-indigo-600/20 flex items-center justify-center gap-2">
        <i data-lucide="log-in" class="w-4 h-4"></i> Entrar no Deployment Center
      </button>
    </form>

    <div class="text-center text-[11px] text-slate-500 border-t border-slate-800/80 pt-4">
      Porta 50000 · Acesso Restrito aos Administradores de Infraestrutura
    </div>
  </div>

  <script>
    if (window.location.search.includes("error=1")) {
      document.getElementById("error-alert").classList.remove("hidden");
    }
    lucide.createIcons();
  </script>
</body>
</html>
